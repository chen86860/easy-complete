[package]
name = "ec_cli"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
publish.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "ec"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []

[dependencies]
anstream.workspace = true
async-trait.workspace = true
bytes.workspace = true
cfg-if.workspace = true
clap.workspace = true
clap_complete = "4.5.46"
clap_complete_fig = { path = "../clap_complete_fig" }
color-eyre = "0.6.5"
color-print = "0.3.5"
crossterm.workspace = true
ctrlc = "3.4.6"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
eyre.workspace = true
fig_diagnostic.workspace = true
fig_install.workspace = true
fig_integrations.workspace = true
fig_ipc.workspace = true
fig_log.workspace = true
fig_os_shim.workspace = true
fig_proto.workspace = true
fig_settings.workspace = true
fig_telemetry.workspace = true
fig_util.workspace = true
futures.workspace = true
glob.workspace = true
globset.workspace = true
indoc.workspace = true
mimalloc.workspace = true
owo-colors = "4.2.0"
regex.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
spinners.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
walkdir.workspace = true
which.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
macos-utils = { path = "../macos-utils" }
objc2-app-kit = { workspace = true, features = ["NSRunningApplication"] }
objc2-foundation.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
insta.workspace = true
pastey = "0.2.3"
predicates = "3.0"
