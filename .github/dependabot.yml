# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Keep Dependabot security updates enabled, but disable routine version-update PRs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    open-pull-requests-limit: 0
    groups:
      eslint:
        patterns: ["eslint", "@eslint/*"]
      typescript-eslint:
        patterns: ["typescript-eslint", "@typescript-eslint/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      radix-ui:
        patterns: ["@radix-ui/*"]
  # The website is a standalone pnpm project with its own lockfile, so keep its entry for
  # Dependabot security updates while routine version-update PRs remain disabled.
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    open-pull-requests-limit: 0
    groups:
      cloudflare:
        patterns: ["@cloudflare/*", "wrangler", "miniflare"]
      tanstack:
        patterns: ["@tanstack/*"]
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      aws:
        patterns: ["aws-*"]
      clap:
        patterns: ["clap", "clap_*"]
