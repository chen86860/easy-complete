# Standalone project — kept out of the parent Rust/TS monorepo workspace.
packages: []
# Security patches for transitive dependencies. Each entry stays inside the range its parent
# asked for, so vite/wrangler/miniflare keep working. Drop an entry once the parent ships a
# version that already resolves past it.
overrides:
  'postcss@8': 8.5.26
  'js-yaml@4': 4.3.2
  'nanoid@3': 3.3.18
  'undici@7': 7.30.1
  'ws@8': 8.21.1
  'esbuild@0.27': 0.28.1
  'zod@<4.6.6': ^4.6.6
allowBuilds:
  core-js: true
  esbuild: true
  sharp: true
  workerd: true
onlyBuiltDependencies:
  - esbuild
  - workerd
  - sharp
# Advisories `pnpm audit` (see .github/workflows/audit.yml) should not fail on. Each needs a
# reason; drop the entry once the dependency moves past it.
auditConfig:
  ignoreGhsas:
    # undici is pinned exactly by wrangler's miniflare (local dev server and deploy tooling);
    # it doesn't ship to the site. Revisit when wrangler moves to a newer miniflare.
    - GHSA-rfgv-xxqx-mfg5
    - GHSA-w293-vg96-wgc3
