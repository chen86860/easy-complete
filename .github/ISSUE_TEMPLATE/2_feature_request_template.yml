name: "Feature request"
description: "Suggest an improvement to Easy Complete / 为 Easy Complete 提出改进建议"

title: "feat: "
labels: ["enhancement"]

body:
- type: markdown
  attributes:
    value: |
      English or 中文 are both fine. / 中英文皆可。

- type: textarea
  id: "problem"
  attributes:
    label: "What problem would this solve?"
    description: |
      Describe what you are trying to do and where Easy Complete gets in the way. Understanding
      the underlying problem often leads to a better solution than the one first imagined.

      请描述你想做什么、以及 Easy Complete 在哪里挡住了你。理解真实需求往往能找到比最初设想更好的方案。
  validations:
    required: true

- type: textarea
  id: "proposal"
  attributes:
    label: "What would you like to see?"
    description: "Your proposed solution, if you have one in mind. / 如果你已有具体想法，请描述。"

- type: textarea
  id: "alternatives"
  attributes:
    label: "Alternatives you have considered"
    description: "Other approaches, existing settings you tried, or workarounds you use today. / 其他方案、你尝试过的现有设置，或目前的变通做法。"
